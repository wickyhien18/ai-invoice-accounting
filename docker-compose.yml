# MySQL 8.0 cho ca nhom. Chay tu thu muc goc: docker compose up -d mysql
# Toan bo bien lay tu file .env duy nhat o thu muc goc.
services:
  mysql:
    image: mysql:8.0
    container_name: ai-invoice-mysql
    restart: unless-stopped
    # utf8mb4 de luu dung tieng Viet (mac dinh cu latin1 se lam hong dau)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
